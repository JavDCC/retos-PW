<!DOCTYPE html>

<html>

<head>
    <title>Reto 2 - PW</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="./style.css" rel="stylesheet" media="all" />

<body>

    <header>
        <img src="./media/banner.jpg" />
    </header>

    <main>
        <section>
            <h4>Formulario de registro:</h4>
            <p id="bordertext">Entrada de datos</p>
            <div id="login">
                <div id="inputs">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" autocomplete="off" />
                    <label for="id">CI</label>
                    <input type="text" id="id" name="id" autocomplete="off" />
                    <label for="pw">Contraseña</label>
                    <input type="password" id="pw" name="pw" autocomplete="off" />
                    <label for="pw2">Confirmacion</label>
                    <input type="password" id="pw2" name="pw2" autocomplete="off" />
                </div>
                <div id="buttons">
                    <button>Enviar</button>
                    <button>Limpiar</button>
                </div>
            </div>
        </section>
        <nav>
            <a href="./base.html">Inicio</a>
            <a href="./login.html">Formulario de registro</a>
        </nav>
    </main>

    <footer>
        <p>
            PW - Reto 2 - <a href="#">Javier David Coroas Cintra</a>
            <br>
            Empleando HTML+CSS+JS
        </p>
    </footer>
    <script src="./script.js"></script>
</body>

</html>
